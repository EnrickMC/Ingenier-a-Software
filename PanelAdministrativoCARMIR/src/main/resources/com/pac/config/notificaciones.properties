# Módulo 4 · Notificaciones al cliente por WhatsApp y correo (RF-47)
#
# YA NO HACE FALTA EDITAR ESTE ARCHIVO: los datos se escriben en el panel, en
# Configuración → Respaldos y sistema → "Notificaciones al cliente", y se guardan en la tabla
# ConfiguracionNotificacion de la base de datos (el token y la contraseña van cifrados).
#
# Este archivo solo tiene los valores de fábrica que se usan mientras no se guarde nada en el panel
# (o si todavía no se ejecuta MIGRACION_COMPLETA.sql). Aquí NO se escriben tokens ni contraseñas.
#
# notificaciones.modo:
#   simulado = no se envía nada; el mensaje se escribe en la consola y se guarda en la tabla
#              Notificacion como "Enviado". Sirve para probar el panel sin cuentas.
#   real     = se envía por WhatsApp Business Cloud API y por correo (SMTP).
notificaciones.modo=simulado

# Reintentos automáticos si un envío falla, y segundos de espera entre cada uno
notificaciones.reintentos=3
notificaciones.segundosEntreReintentos=20

# WhatsApp Business Cloud API (Meta)
whatsapp.idNumeroTelefono=
whatsapp.versionApi=v20.0
# Lada que se antepone a los teléfonos de 10 dígitos (México = 52)
whatsapp.lada=52

# Correo (SMTP). seguridad: STARTTLS (puerto 587) o SSL (puerto 465)
smtp.servidor=smtp.gmail.com
smtp.puerto=587
smtp.seguridad=STARTTLS
smtp.usuario=
smtp.remitente=
