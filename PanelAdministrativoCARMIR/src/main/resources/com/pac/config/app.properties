# Configuración general del Panel Administrativo CARMIR
# true  = los inicios de sesión NO consultan MySQL (modo demostración).
# false = se valida contra la tabla Usuario de CARMIR_DB.
# El apartado "Usuarios y Permisos" siempre usa MySQL.
app.modoDemo=false

# La cuenta de la Administradora NO se configura aquí: está fija en el código,
# en modulos/usuarios/service/AdministradoraSistema.java (constantes USUARIO y CONTRASENA).

# ---------------------------------------------------------------------------------
# IMPORTANTE: desde el apartado "Configuración" estos valores se guardan en la tabla
# Configuracion de la base de datos y esos son los que usa el panel.
# Los de este archivo solo se usan si la tabla todavía no existe
# (falta ejecutar DBCarmir/migraciones/MIGRACION_COMPLETA.sql) o no hay conexión.
# ---------------------------------------------------------------------------------

# Intentos fallidos seguidos antes de bloquear una cuenta del Personal
app.intentosMaximosLogin=3

app.nombreNegocio=Delicias de Postres

# Minutos sin usar el panel antes de cerrar la sesión (0 = no se cierra sola)
app.minutosInactividadSesion=30

# Módulo 5 · Inventario: días antes de la caducidad de un lote en que se avisa "Próxima caducidad"
inventario.diasAvisoCaducidad=3

# Módulo 4 · Pedidos: pedidos que se pueden entregar en un mismo día antes de avisar "Agenda saturada"
pedidos.capacidadDiaria=6
# Módulo 4 · Pedidos: días antes de la entrega en que un pedido debe pasar a "En preparación"
pedidos.diasParaPreparar=2
# Módulo 4 · Agenda: días máximos de un rango personalizado
pedidos.diasMaximosAgenda=62

# Configuración · Respaldos: carpeta "bin" de MySQL donde están mysqldump y mysql.
# Vacío = se busca sola (PATH, C:\Program Files\MySQL\..., XAMPP). Ejemplo:
# respaldos.carpetaMysql=C:\\Program Files\\MySQL\\MySQL Server 8.0\\bin
respaldos.carpetaMysql=
